<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý Máy ảnh & Thiết bị')}"></head>
<body>
<div class="app-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar('equipments')}"></aside>

    <div class="main-content">
        <header th:replace="~{fragments/layout :: topbar('Quản lý Máy ảnh, Ống kính & Thiết bị Quay phim')}"></header>

        <main class="page-container">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div th:class="${isAdmin} ? 'grid-sidebar-left' : ''">
                <!-- Cột trái (Chỉ hiển thị cho Admin): Form Thêm/Sửa Thiết bị & Quản lý Danh mục -->
                <div th:if="${isAdmin}">
                    <div class="card">
                        <div class="card-header">
                            <h3>
                                <i class="fa-solid fa-pen-to-square" style="color: var(--primary);"></i>
                                <span th:text="${equipmentForm.id != null} ? 'Cập nhật thiết bị' : 'Thêm thiết bị mới'"></span>
                            </h3>
                            <a th:if="${equipmentForm.id != null}" th:href="@{/equipments}" class="btn btn-outline btn-sm">
                                Hủy sửa
                            </a>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/equipments/save}" method="post">
                                <input type="hidden" name="id" th:value="${equipmentForm.id}">

                                <div class="form-group">
                                    <label class="form-label">Mã thiết bị *</label>
                                    <input type="text" name="code" class="form-control"
                                           th:value="${equipmentForm.code}" placeholder="VD: CAM-004, LENS-004" required>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Tên thiết bị *</label>
                                    <input type="text" name="name" class="form-control"
                                           th:value="${equipmentForm.name}" placeholder="VD: Sony Alpha A7S III" required>
                                </div>

                                <div class="grid-2" style="gap: 12px;">
                                    <div class="form-group">
                                        <label class="form-label">Hãng sản xuất *</label>
                                        <input type="text" name="brand" class="form-control"
                                               th:value="${equipmentForm.brand}" placeholder="Sony, Canon, DJI..." required>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Danh mục *</label>
                                        <select name="categoryId" class="form-select" required>
                                            <option th:each="c : ${categories}"
                                                    th:value="${c.id}"
                                                    th:text="${c.name}"
                                                    th:selected="${equipmentForm.category != null and equipmentForm.category.id == c.id}">
                                            </option>
                                        </select>
                                    </div>
                                </div>

                                <div class="grid-2" style="gap: 12px;">
                                    <div class="form-group">
                                        <label class="form-label">Giá thuê/ngày (VNĐ) *</label>
                                        <input type="number" name="dailyRate" class="form-control" min="0" step="1000"
                                               th:value="${equipmentForm.dailyRate != null ? equipmentForm.dailyRate.longValue() : ''}"
                                               placeholder="VD: 450000" required>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Tiền cọc (VNĐ) *</label>
                                        <input type="number" name="depositAmount" class="form-control" min="0" step="10000"
                                               th:value="${equipmentForm.depositAmount != null ? equipmentForm.depositAmount.longValue() : ''}"
                                               placeholder="VD: 5000000" required>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Trạng thái hiện tại *</label>
                                    <select name="status" class="form-select">
                                        <option th:each="s : ${statuses}"
                                                th:value="${s.name()}"
                                                th:text="${s.displayName}"
                                                th:selected="${equipmentForm.status == s}">
                                        </option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Ghi chú tình trạng &amp; Phụ kiện đi kèm</label>
                                    <input type="text" name="conditionNote" class="form-control"
                                           th:value="${equipmentForm.conditionNote}"
                                           placeholder="VD: Mới 99%, kèm 2 pin zin + thẻ 64GB">
                                </div>

                                <div class="form-group">
                                    <label class="form-label">URL Hình ảnh (tùy chọn)</label>
                                    <input type="text" name="imageUrl" class="form-control"
                                           th:value="${equipmentForm.imageUrl}"
                                           placeholder="https://images.unsplash.com/...">
                                </div>

                                <button type="submit" class="btn btn-primary" style="width: 100%;">
                                    <i class="fa-solid fa-floppy-disk"></i>
                                    <span th:text="${equipmentForm.id != null} ? 'Lưu cập nhật thiết bị' : 'Thêm vào kho thiết bị'"></span>
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- Quản lý danh mục -->
                    <div class="card">
                        <div class="card-header">
                            <h3>
                                <i class="fa-solid fa-layer-group" style="color: #10b981;"></i>
                                Quản lý Danh mục thiết bị
                            </h3>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/categories/save}" method="post" style="margin-bottom: 16px;">
                                <div class="form-group">
                                    <label class="form-label">Tên danh mục mới *</label>
                                    <input type="text" name="name" class="form-control" placeholder="VD: Ống kính Cinema" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Mô tả ngắn</label>
                                    <input type="text" name="description" class="form-control" placeholder="Mô tả danh mục...">
                                </div>
                                <button type="submit" class="btn btn-success btn-sm" style="width: 100%;">
                                    <i class="fa-solid fa-plus"></i> Thêm danh mục
                                </button>
                            </form>

                            <div style="border-top: 1px solid var(--border-color); padding-top: 12px;">
                                <div th:each="c : ${categories}"
                                     style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--border-color);">
                                    <div>
                                        <div style="font-weight: 600; font-size: 13px;" th:text="${c.name}"></div>
                                        <div style="font-size: 11.5px; color: var(--text-muted);"
                                             th:text="${#lists.size(c.equipments)} + ' thiết bị'"></div>
                                    </div>
                                    <form th:action="@{/categories/delete/{id}(id=${c.id})}" method="post"
                                          onsubmit="return confirm('Bạn có chắc muốn xóa danh mục này?');">
                                        <button type="submit" class="btn btn-outline btn-sm" style="color: var(--danger);" title="Xóa danh mục">
                                            <i class="fa-solid fa-trash-can"></i>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Cột phải: Bộ lọc tìm kiếm & Danh sách thiết bị -->
                <div>
                    <div class="card">
                        <div class="card-header">
                            <h3>
                                <i class="fa-solid fa-sliders" style="color: var(--primary);"></i>
                                Tìm kiếm &amp; Lọc thiết bị (<span th:text="${#lists.size(equipments)}"></span> thiết bị)
                            </h3>
                        </div>
                        <div class="card-body" style="padding-bottom: 16px;">
                            <form th:action="@{/equipments}" method="get" class="filter-bar">
                                <input type="text" name="keyword" class="form-control" style="flex: 1; min-width: 200px;"
                                       th:value="${keyword}" placeholder="Nhập tên máy, hãng, hoặc mã thiết bị (VD: Sony, CAM-001)...">

                                <select name="categoryId" class="form-select" style="width: 200px;">
                                    <option value="">-- Tất cả danh mục --</option>
                                    <option th:each="c : ${categories}"
                                            th:value="${c.id}"
                                            th:text="${c.name}"
                                            th:selected="${selectedCategoryId != null and selectedCategoryId == c.id}">
                                    </option>
                                </select>

                                <select name="status" class="form-select" style="width: 180px;">
                                    <option value="">-- Tất cả trạng thái --</option>
                                    <option th:each="s : ${statuses}"
                                            th:value="${s.name()}"
                                            th:text="${s.displayName}"
                                            th:selected="${selectedStatus != null and selectedStatus == s}">
                                    </option>
                                </select>

                                <button type="submit" class="btn btn-primary">
                                    <i class="fa-solid fa-magnifying-glass"></i> Lọc
                                </button>
                                <a th:href="@{/equipments}" class="btn btn-outline">
                                    <i class="fa-solid fa-rotate-right"></i> Đặt lại
                                </a>
                            </form>
                        </div>

                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                <tr>
                                    <th>Ảnh</th>
                                    <th>Mã &amp; Tên thiết bị</th>
                                    <th>Danh mục</th>
                                    <th>Giá thuê/ngày</th>
                                    <th>Tiền cọc</th>
                                    <th>Tình trạng</th>
                                    <th>Trạng thái</th>
                                    <th th:if="${isAdmin}">Thao tác</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${#lists.isEmpty(equipments)}">
                                    <td colspan="8" style="text-align: center; padding: 32px; color: var(--text-muted);">
                                        Không tìm thấy thiết bị nào phù hợp với điều kiện lọc.
                                    </td>
                                </tr>
                                <tr th:each="e : ${equipments}">
                                    <td>
                                        <img th:src="${e.imageUrl != null and !e.imageUrl.isEmpty() ? e.imageUrl : 'https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=200'}"
                                             onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1617005082133-548c4dd27f35?w=200&auto=format&fit=crop&q=80';"
                                             class="eq-thumb" alt="Ảnh thiết bị">
                                    </td>
                                    <td>
                                        <div style="font-size: 11.5px; font-weight: 700; color: var(--primary);" th:text="${e.code}"></div>
                                        <div style="font-weight: 600; color: var(--dark);" th:text="${e.name}"></div>
                                        <div style="font-size: 12px; color: var(--text-muted);" th:text="'Hãng: ' + ${e.brand}"></div>
                                    </td>
                                    <td>
                                        <span class="badge badge-secondary" th:text="${e.category.name}"></span>
                                    </td>
                                    <td style="font-weight: 700; color: #059669;"
                                        th:text="${#numbers.formatDecimal(e.dailyRate, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                    <td style="font-weight: 600;"
                                        th:text="${#numbers.formatDecimal(e.depositAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                    <td style="max-width: 220px; font-size: 12.5px; color: var(--secondary);"
                                        th:text="${e.conditionNote}"></td>
                                    <td>
                                        <span class="badge" th:classappend="${e.status.badgeClass}" th:text="${e.status.displayName}"></span>
                                    </td>
                                    <td th:if="${isAdmin}">
                                        <div style="display: flex; gap: 6px;">
                                            <a th:href="@{/equipments(editId=${e.id}, keyword=${keyword}, categoryId=${selectedCategoryId}, status=${selectedStatus})}"
                                               class="btn btn-outline btn-sm" title="Sửa thiết bị">
                                                <i class="fa-solid fa-pen"></i>
                                            </a>
                                            <form th:action="@{/equipments/delete/{id}(id=${e.id})}" method="post"
                                                  onsubmit="return confirm('Xác nhận xóa thiết bị này khỏi kho?');">
                                                <button type="submit" class="btn btn-outline btn-sm" style="color: var(--danger);" title="Xóa">
                                                    <i class="fa-solid fa-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
