spring.application.name=camera-rental-management
server.port=8080

# ===================================================================
# CẤU HÌNH KẾT NỐI MYSQL (Mặc định cho XAMPP: user=root, password rỗng)
# Nếu bạn dùng MySQL Workbench có đặt mật khẩu, hãy điền vào spring.datasource.password
# Hệ thống sẽ TỰ ĐỘNG tạo database 'camera_rental_db' và dữ liệu mẫu khi chạy!
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/camera_rental_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tự động tạo/cập nhật bảng từ các class Entity Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình Thymeleaf (Tắt cache để sửa HTML/CSS thấy ngay trên trình duyệt)
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
